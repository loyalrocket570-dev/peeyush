<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockWise - Home</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Inline SVG favicon to avoid browser requesting /favicon.ico and causing a 404 -->
  <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23141416'/><circle cx='16' cy='16' r='12' fill='%231db954'/></svg>" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <header class="top-bar">
    <div class="top-left">
      <button class="menu-btn" aria-label="menu">☰</button>
      <img src="assets/logo.svg" alt="StockWise" class="logo">
      <div class="brand">
        <div class="brand-title">StockWise Junior</div>
        <div class="brand-sub">stockwisejuniors.com</div>
      </div>
    </div>
    <div class="top-right">
      <div class="credits">Available Credits<br><span class="credits-amt">₹570.60</span></div>
      <button id="refreshBtn" class="refresh">Refresh</button>
      <div class="avatar">P</div>
    </div>
  </header>

  <main class="content">
    <section class="hero">
      <div class="greeting">
        <h2>Good Evening, Peeyush Sharma!</h2>
        <div class="today">Monday, October 20, 2025</div>
      </div>

      <div class="search-wrap">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Search any Indian stock...">
          <button id="searchBtn">🔍</button>
        </div>
        <div class="key-box">
          <input id="apiKeyInput" placeholder="Alpha Vantage API key (paste here)" />
          <button id="saveKeyBtn">Save key</button>
        </div>
      </div>
    </section>

    <div id="stockResults" class="results"></div>

    <div class="chart-container">
      <canvas id="stockChart"></canvas>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="index.html" class="active">Home</a>
    <a href="portfolio.html">Portfolio</a>
    <a href="quiz.html">Quiz</a>
  </nav>

  <script src="chart.js"></script>
  <script src="config.js"></script>
  <script src="stocks.js"></script>
  <script src="script.js"></script>
  <noscript>
    <div style="padding:20px;background:#111;margin:16px;border-radius:8px;text-align:center;color:#f66">JavaScript is required for this page. Please enable JavaScript in your browser.</div>
  </noscript>
</body>
</html>
